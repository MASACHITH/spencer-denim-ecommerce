# Spencer Denim web gateway: main nginx configuration (W0-15, docs/15-deployment-runbook.md).
#
# Runs as the unprivileged nginx user (uid 101) with a read-only root filesystem: every writable path is under
# /tmp (a tmpfs in the compose file). The server block is rendered from templates/gateway/*.template into
# /tmp/gateway/ by the image's entrypoint at start-up, substituting only SD_* environment variables.

worker_processes auto;
pid /tmp/nginx.pid;
# The error log cannot be redacted, so it is kept as quiet as nginx allows (issue #179).
#
# nginx appends the whole request to most request-related error lines: the client address, the request line with
# its query string, the upstream URL and the Referer header, e.g.
#
#   [error] connect() failed (111: Connection refused) while connecting to upstream, client: 203.0.113.9,
#   server: _, request: "GET /order/<token> HTTP/1.1", upstream: "http://10.0.0.5:4000/order/<token>",
#   host: "...", referrer: "https://.../order/<token>"
#
# and no log_format reaches it. Those lines are written at level error (upstream refused, timed out or not
# resolved; request body too large) and warn (a body or response spilled to a temporary file), so the level is
# crit and the ordinary failures above are not written at all. The access log still records every failure
# (status 502/504, the upstream tried, the time taken) without the secret; what is lost is only nginx's own
# explanation. docs/15 section 8a says how to get it back when it is needed, and what to do with the logs afterwards.
#
# What crit does NOT guarantee (found by the #179 tester): a crit line CAN carry the request, namely when nginx
# cannot write a temporary file for a response or a request body (a full disk, a directory it may not write):
#
#   [crit] pwrite() "/tmp/client_temp/..." failed (28: No space left on device), client: 203.0.113.9,
#   request: "POST /api/orders/<token>/cancel?token=... HTTP/1.1", referrer: "..."
#
# Two things keep that rare. proxy_max_temp_file_size 0 (sd-gateway.conf.template) stops a response being spilled
# to disk at all, and the host tier buffers a request body before it reaches this gateway. This gateway's /tmp is a
# tmpfs inside the container's 128 MB memory limit (compose.yml), not a disk: a body that does not fit there ends in
# an out-of-memory kill of the container rather than a disk-full line. What is left is a request body larger
# than client_body_buffer_size on a full or unwritable /tmp; a line like that is a sign something is badly wrong
# and docs/15 section 8a lists it as a log that must be treated as sensitive.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =================================================================================================================
    # The access log: no visitor address, no credential (issue #179, docs/15 section 8a)
    # =================================================================================================================
    #
    # This shop puts credentials in web addresses by design, and a log line that copies the address copies the
    # credential: anyone who can read the log (hosting staff, a backup, a log shipper added later) could open a
    # customer's order. So a line is built only from variables that cannot carry one:
    #
    #   * $uri, never $request_uri. $uri is the path alone, already percent-decoded and normalised (%6f is o,
    #     // is /, /./ and /../ are resolved), so the query string (?token= on /account/reset-password and
    #     /account/confirm-email, ?token=&PayerID= on the PayPal return, ?returnTo=) is never in it, and an
    #     encoded spelling of a secret route cannot dodge the rules below. Behind try_files the final $uri of an
    #     admin screen is /admin/index.html, which is fine: no admin screen address is worth logging.
    #   * the path is reduced further by $sd_log_path (below): a segment survives only if it is a catalogue-style
    #     slug, which is the rule SpencerDenim.Application.Analytics.PagePath applies before it stores a page view.
    #   * no visitor address of any kind: not $remote_addr, not the X-Forwarded-For chain. $realip_remote_addr
    #     (the socket peer, the host's nginx) is dropped too: it is not a visitor, but it would become one if the
    #     published port were ever opened to the internet. An address kept "in case of abuse" is a decision for the
    #     owner, with a short retention, not a default (docs/15 section 8a).
    #   * the Referer as a host name only. Its path and query copy the previous page's address, so a click from
    #     an order page to anywhere else would write the order link a second time.
    #
    # The error log is the one place a format cannot reach: see error_log at the top of this file.

    # --- Referer: the host name and nothing else ---------------------------------------------------------------
    # A dotted name that ends in a letter, so an IP literal (a visitor's own address, an internal one) is
    # rejected. The name may be followed only by a numeric port, a path, a query, a fragment or the end, so
    # anything with userinfo ("user:password@host", "a.b:80@c.d", "tok3n.user:pw@host") is rejected: the user
    # name is followed by ":" or "@", and neither is a port made of digits. At most 253 characters, the longest
    # a host name can be, so a client cannot write a long string into every line.
    map $http_referer $sd_referer_host {
        default "";
        "~^https?://(?![^/?#:@]{254})(?<sd_ref>(?:[A-Za-z0-9-]+[.])+[A-Za-z][A-Za-z0-9-]*)(?::[0-9]{1,5})?(?:[/?#]|$)" $sd_ref;
    }

    # --- The User-Agent, capped -----------------------------------------------------------------------------
    # Not a credential, but it is client-supplied and unbounded, and every request writes it. 200 characters is
    # more than any real browser sends.
    map $http_user_agent $sd_user_agent {
        default "";
        "~^(?<sd_ua>.{1,200})" $sd_ua;
    }

    # --- The path that is written to the log ------------------------------------------------------------------
    # Rules are tried top to bottom and the first that matches decides ("/" is an exact match and is tried first).
    #
    # 1. Routes that carry a credential IN THE PATH. Everything below the prefix is replaced, whatever it looks
    #    like, because the generic rule further down recognises a token only by its shape (a GUID, seven digits, a
    #    long word) and a token whose shape changed would pass it. This is the list the audit of the Angular
    #    routes (storefront app.routes.ts and account.routes.ts, admin app.routes.ts) and of the API's
    #    MapGet/MapPost templates produced; extend it when a route that puts a secret in its path is added.
    #
    #      /order/{token}                                   storefront: the guest order link. The address IS the
    #                                                       credential (docs/08 3.5 Orders.PublicId). PagePath
    #                                                       stores the same thing, /order/*
    #      /api/orders/{publicId}[/...]                     the order page's own API calls (view, payment
    #                                                       reference, cancel, bank-slip upload and download):
    #                                                       the same token, in the API's path
    #      /api/payments/paypal/{start|return|cancel}/{id}  the PayPal round trip; the browser navigates to
    #                                                       these with the order token in the path
    #      /api/admin/orders/{id}[/invoice]                 staff views of an order. The id opens the customer's
    #      /api/admin/orders/bank-transfers/{id}/...        /order/{id} page, so it is a credential too
    #
    #    Credentials that travel in the QUERY STRING (/account/reset-password, /account/confirm-email, the PayPal
    #    return's token and PayerID, returnTo) need no rule: $uri has no query string.
    #
    #    Matching is case-insensitive because the API's routing is. The first pattern allows ";" after "order"
    #    because the Angular router ignores matrix parameters, so /order;x=1/{token} opens the same page.
    #
    # 2. Everything else: the leading segments that are slugs are kept, up to seven deep; at the first segment
    #    that is not, it and everything after it become "*", so /api/admin/customers/1234567/orders is logged as
    #    /api/admin/customers/*. A slug is lower-case letters and digits separated by single hyphens, at most 100
    #    characters, not a GUID and without a run of seven or more digits (hyphens ignored): the PagePath rule.
    #    One check is added here, because a log sees addresses nobody routed: no word of 16 or more characters
    #    (a run of letters and digits with no hyphen), which a slug does not have and a random token does. The one
    #    exception to "slugs only" is a static file as the LAST segment (main-AB12CD.js, inter.woff2), kept when
    #    its extension is on the list, so a missing asset can still be told from a missing page.
    #
    #    It is an allow-list, so a route added later cannot leak by default: whatever it does not recognise is
    #    starred before anybody has thought about it. It is a net for shapes, not a proof about tokens: a secret
    #    of fifteen lower-case letters would pass it, which is why the routes in 1. are listed by name.
    map $uri $sd_log_path {
        default "/*";
        "/"     "/";

        "~*^/order(?:[;/]|$)"                                              "/order/*";
        "~*^/api/orders(?:[;/]|$)"                                         "/api/orders/*";
        "~*^/api/payments/paypal/(?<sd_a>start|return|cancel)(?:[;/]|$)"   "/api/payments/paypal/$sd_a/*";
        "~*^/api/admin/orders/bank-transfers/[^/]"                         "/api/admin/orders/bank-transfers/*";
        "~*^/api/admin/orders/(?!bank-transfers(?:[;/]|$))[^/]"            "/api/admin/orders/*";

        "~^(?<sd_p>(?:/(?=[^/]{1,100}(?:/|$))(?![0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}(?:/|$))(?![^/]*(?:[0-9]-?){6}[0-9])(?![^/]*[a-z0-9]{16})[a-z0-9]+(?:-[a-z0-9]+)*(?=/|$)){0,7})/?$" $sd_p;
        "~^(?<sd_p>(?:/(?=[^/]{1,100}(?:/|$))(?![0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}(?:/|$))(?![^/]*(?:[0-9]-?){6}[0-9])(?![^/]*[a-z0-9]{16})[a-z0-9]+(?:-[a-z0-9]+)*(?=/|$)){0,6})/(?<sd_f>(?![0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12})(?![^/]*(?:[0-9]-?){6}[0-9])(?![^/]*[A-Za-z0-9]{16})[A-Za-z0-9_-]{1,100}(?:[.][A-Za-z0-9_-]{1,100}){0,3}[.](?:js|mjs|css|map|json|txt|xml|html|ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|mp4|webm|pdf))$" "$sd_p/$sd_f";
        "~^(?<sd_p>(?:/(?=[^/]{1,100}(?:/|$))(?![0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}(?:/|$))(?![^/]*(?:[0-9]-?){6}[0-9])(?![^/]*[a-z0-9]{16})[a-z0-9]+(?:-[a-z0-9]+)*(?=/|$)){0,7})/" "$sd_p/*";
    }

    # One JSON object per line. There is no field for the visitor's address and none for a query string.
    log_format sd_json escape=json
        '{"time":"$time_iso8601","method":"$request_method","path":"$sd_log_path",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"host":"$host","referer_host":"$sd_referer_host","user_agent":"$sd_user_agent"}';
    access_log /dev/stdout sd_json;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /tmp/gateway/*.conf;
}
