# Spencer Denim web gateway: main nginx configuration (W0-15, docs/15-deployment-runbook.md).
#
# Runs as the unprivileged nginx user (uid 101) with a read-only root filesystem: every writable path is under
# /tmp (a tmpfs in the compose file). The server block is rendered from templates/gateway/*.template into
# /tmp/gateway/ by the image's entrypoint at start-up, substituting only SD_* environment variables.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # One JSON object per line. remote_addr is the visitor (after the real_ip module), realip_remote_addr the
    # socket peer (the host's nginx, seen through Docker's port publishing).
    log_format sd_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","peer":"$realip_remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"host":"$host","referer":"$http_referer","user_agent":"$http_user_agent"}';
    access_log /dev/stdout sd_json;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /tmp/gateway/*.conf;
}
