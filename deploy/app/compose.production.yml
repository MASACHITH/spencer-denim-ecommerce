# Spencer Denim application stack: production (W0-15, docs/15-deployment-runbook.md §3).
#
# Everything that differs between environments and is not a secret. Used with compose.yml:
#
#   docker compose -p sd-production -f compose.yml -f compose.production.yml --env-file ../config/app.env up -d --wait
#
# Addresses (see docs/15 §3 for the full table):
#   published port   127.0.0.1:38080   (the host's nginx proxies https://<production host>/ to it)
#   edge subnet      10.251.0.0/24    host side 10.251.0.1, gateway 10.251.0.10, dynamic 10.251.0.128/25
#   database network sd-production-db       (created by the production database stack)
#
# The gateway's address appears twice below (its fixed address and the API's trusted proxy) and the host-side
# address twice (the network's gateway and the gateway container's trusted peer). The YAML anchors keep each pair
# identical; change the values here, in x-sd-addresses, and nowhere else.

# The compose project name: container, network and volume names all start with it.
name: sd-production

x-sd-addresses:
  edge-subnet: &edge_subnet 10.251.0.0/24
  edge-dynamic-range: &edge_dynamic_range 10.251.0.128/25
  edge-host-ip: &edge_host_ip 10.251.0.1
  gateway-ip: &gateway_ip 10.251.0.10

services:
  migrator:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    mem_limit: 384m

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ForwardedHeaders__KnownProxies: *gateway_ip
    mem_limit: 768m
    cpus: 1.0

  storefront:
    mem_limit: 512m

  web:
    environment:
      SD_REAL_IP_FROM: *edge_host_ip
    mem_limit: 128m
    ports:
      - "127.0.0.1:38080:8080"
    networks:
      edge:
        ipv4_address: *gateway_ip

networks:
  edge:
    ipam:
      config:
        - subnet: *edge_subnet
          ip_range: *edge_dynamic_range
          gateway: *edge_host_ip
  db:
    name: sd-production-db
