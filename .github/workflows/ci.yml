name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main; superseded branch runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Throwaway password for the ephemeral SQL Server container in CI. Declared once, used through the env context.
  # It protects nothing outside the job and is never used by the application.
  SQL_SA_PASSWORD: CiOnly-Ephemeral-Passw0rd

jobs:
  backend:
    name: Backend (.NET build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      sqlserver:
        # Pinned tag: "2022-latest" moves, which would make a green run unreproducible.
        # There is deliberately no --health-cmd; the "Wait for SQL Server" step below gates the tests instead.
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ env.SQL_SA_PASSWORD }}
        ports:
          - 1433:1433

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Wait for SQL Server
        shell: bash
        run: |
          set -uo pipefail

          container="$(docker ps --format '{{.ID}} {{.Image}}' | awk '/mssql\/server/ { print $1; exit }')"
          if [ -z "$container" ]; then
            echo "::error::SQL Server service container is not running."
            docker ps -a
            exit 1
          fi

          # A login must succeed, not just an open port: the engine accepts TCP before it finishes recovery.
          for attempt in $(seq 1 40); do
            for sqlcmd in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
              if docker exec "$container" "$sqlcmd" -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null 2>&1; then
                echo "SQL Server accepted a login on attempt $attempt ($sqlcmd)."
                echo "TEST_SQL_CONNECTION=Server=localhost,1433;User Id=sa;Password=$SQL_SA_PASSWORD;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            sleep 5
          done

          echo "::error::SQL Server did not accept a login within 200 seconds."
          docker logs "$container" | tail -n 50
          exit 1

      - name: Restore
        run: dotnet restore SpencerDenim.sln

      - name: Build
        run: dotnet build SpencerDenim.sln --configuration Release --no-restore

      - name: Test (unit and integration against SQL Server)
        run: >-
          dotnet test SpencerDenim.sln
          --configuration Release
          --no-build
          --logger "trx;LogFilePrefix=results"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, unit tests, builds)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: src/frontend/.angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}-
            angular-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (headless)
        run: npm run test:ci

      - name: Build shared library
        run: npm run build:shared

      - name: Build storefront (SSR)
        run: npm run build:storefront

      - name: Build admin
        run: npm run build:admin

      # Browser tests catch what jsdom cannot see: reduced-motion focus handling,
      # real layout at each breakpoint, and touch-target sizes. See docs/06 §4.
      # Browsers are keyed to the exact Playwright version, so the lockfile is a reliable cache key.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (storefront shell)
        run: npx playwright test

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/frontend/playwright-report
            src/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: SSR smoke test
        shell: bash
        run: |
          set -uo pipefail

          node dist/storefront/server/server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::The SSR server did not answer /healthz within 30 seconds."
            exit 1
          fi

          html="$(curl -sf http://127.0.0.1:4000/)" || {
            echo "::error::The SSR server did not return the home page."
            exit 1
          }

          # Match in-shell rather than through a pipe: `grep -q` exits at the first match,
          # which gives `printf` a broken pipe once the page is larger than the pipe buffer,
          # and pipefail then fails the step even though the text was found.
          for marker in 'New Arrivals' 'Sale'; do
            if [[ "$html" != *"$marker"* ]]; then
              echo "::error::Server-rendered HTML does not contain '$marker'."
              echo "${html:0:2000}"
              exit 1
            fi
          done

          # The wordmark, tied to its own element rather than looked for anywhere on the page.
          # A bare 'Colombo Wardrobe' substring proves nothing: delete the whole <header> and 12
          # occurrences survive in the footer, the nav and the inlined JSON, so the check passed
          # with no wordmark at all. The name is written out rather than read from BRAND because
          # this is an assertion about the shipped bundle, like the specs. `[[ =~ ]]` avoids a
          # pipe, for the pipefail reason above.
          #
          # Keyed on the wordmark's own `data-testid` rather than on its class plus its position.
          # The anchor holds *either* an uploaded logo or the text now (GLB-02), so the name is no
          # longer a direct child of it — Angular server-renders
          # `<a ... class="wordmark site-header__wordmark" ...><!----><span
          # data-testid="wordmark-text">Colombo Wardrobe</span><!----></a>` — and the previous
          # pattern required the text to follow the opening tag with nothing but whitespace
          # between, so it went red on markup that was correct. Measured against the real bundle,
          # not read off the source: `data-testid="wordmark-text"` occurs exactly once in the page,
          # where `Colombo Wardrobe` occurs twelve times and `site-header__wordmark` three. A
          # testid also survives a class reorder, which the old `site-header__wordmark"` guard did
          # not: it quietly depended on that class being the last one in the attribute.
          #
          # Both header states are accepted, because both carry the name: the text span, or an
          # uploaded logo whose alt falls back to the shop's name (GLB-12, WCAG 1.1.1). With no API
          # behind this server there are no settings and so no logo, so it is the text branch that
          # is exercised here — proved by mutation, by deleting the `@else` and watching this go
          # red. The logo branch is allowed so this does not become a tripwire if the storefront
          # ever server-renders a default one, and is written for either attribute order because
          # the template's order is not a promise. Neither pattern can reach the inlined <style>,
          # which carries no testid, nor the footer or nav, where these testids do not appear.
          wordmark_text='data-testid="wordmark-text"[^>]*>[[:space:]]*Colombo Wardrobe'
          wordmark_logo='data-testid="logo"[^>]*alt="[^"]*Colombo Wardrobe|alt="[^"]*Colombo Wardrobe"[^>]*data-testid="logo"'
          if [[ ! "$html" =~ $wordmark_text ]] && [[ ! "$html" =~ $wordmark_logo ]]; then
            echo "::error::Server-rendered HTML has no Colombo Wardrobe wordmark in the site header."
            # Not the first 2000 bytes: those are all <head>, so the markup this assertion is about
            # was missing from the log the one time it fired. Print the header's own anchor instead,
            # and fall back to the head only when there is no anchor to print. A here-string rather
            # than a pipe, and `-m1` rather than `head -1`, for the pipefail reason above.
            anchor="$(grep -o -m1 '<a[^>]*site-header__wordmark.\{0,400\}' <<<"$html")"
            if [ -n "$anchor" ]; then
              echo "The site header's wordmark anchor, as served:"
              echo "$anchor"
            else
              echo "There is no site-header__wordmark anchor in the page at all. First 2000 bytes:"
              echo "${html:0:2000}"
            fi
            exit 1
          fi

          echo "Server-rendered HTML contains the expected markers (${#html} bytes)."

          # robots.txt, against a server with **no catalogue API behind it at all** (GLB-11). It is
          # answered by Express from the request alone, which is what has to stay true: a crawler
          # answered 5xx for robots.txt treats the whole site as disallowed until it can read one, so
          # this must not depend on anything that can be down. The Playwright suite measures the rest;
          # this is the one assertion worth making with nothing else running.
          robots="$(curl -sf http://127.0.0.1:4000/robots.txt)" || {
            echo "::error::robots.txt was not served. A crawler reads a 5xx here as 'the whole site is disallowed'."
            exit 1
          }

          for marker in 'User-agent: *' 'Sitemap: '; do
            if [[ "$robots" != *"$marker"* ]]; then
              echo "::error::robots.txt does not contain '$marker'."
              echo "$robots"
              exit 1
            fi
          done

          # And sitemap.xml with no catalogue: 503 with Retry-After, never a 500 and never an empty
          # urlset, which is a valid document that says this shop has no pages.
          sitemap_status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/sitemap.xml)"
          if [ "$sitemap_status" != "503" ]; then
            echo "::error::sitemap.xml answered $sitemap_status with no catalogue behind it; expected 503."
            exit 1
          fi

          echo "robots.txt is served without a catalogue, and sitemap.xml answers 503."
