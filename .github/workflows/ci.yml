name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          # Throwaway password for this ephemeral CI container only. It protects nothing outside the job.
          MSSQL_SA_PASSWORD: CiOnly-Ephemeral-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnly-Ephemeral-Passw0rd -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      TEST_SQL_CONNECTION: Server=localhost,1433;User Id=sa;Password=CiOnly-Ephemeral-Passw0rd;Encrypt=True;TrustServerCertificate=True

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Wait for SQL Server
        shell: bash
        run: |
          # The service health check already gates the job; this guards against a slow first login.
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              echo "SQL Server port is open (attempt $attempt)."
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not open port 1433 in time." >&2
          exit 1

      - name: Restore
        run: dotnet restore SpencerDenim.sln

      - name: Build
        run: dotnet build SpencerDenim.sln --configuration Release --no-restore

      - name: Test (unit and integration against SQL Server)
        run: >-
          dotnet test SpencerDenim.sln
          --configuration Release
          --no-build
          --logger "trx;LogFilePrefix=results"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, unit tests, builds)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (headless)
        run: npm run test:ci

      - name: Build storefront (SSR)
        run: npm run build:storefront

      - name: Build admin
        run: npm run build:admin
