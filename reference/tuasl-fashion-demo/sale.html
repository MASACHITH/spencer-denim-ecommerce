<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sale at TU@SL Fashion — up to 35% off on women's, men's, kids' and baby clothing.">
  <title>Sale — TU@SL Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div id="header-placeholder"></div>
<main id="main-content">
  <div class="page-hero" style="background:linear-gradient(135deg,#7f0000,var(--sale))">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html">Home</a><span>›</span><span>Sale</span></nav>
      <h1>Summer Sale</h1>
      <p>Up to 35% off — limited time only. Don't miss out on these incredible deals.</p>
    </div>
  </div>
  <section class="section">
    <div class="container">
      <div class="category-toolbar">
        <p class="category-count" id="product-count"></p>
        <select class="sort-select" id="sort-select" aria-label="Sort products">
          <option value="discount">Biggest Discount</option>
          <option value="recommended">Recommended</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
      <div class="products-grid stagger-children" id="sale-grid"></div>
    </div>
  </section>
</main>
<div id="footer-placeholder"></div>
<script src="js/config.js"></script><script src="js/products.js"></script><script src="js/wishlist.js"></script><script src="js/cart.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let items = getSaleProducts().sort((a,b)=>b.discount-a.discount);
  const grid = document.getElementById('sale-grid');
  const count = document.getElementById('product-count');
  const sort = document.getElementById('sort-select');
  function render(list) {
    grid.innerHTML = list.map(renderProductCard).join('');
    count.textContent = `${list.length} products on sale`;
    initScrollReveal();
  }
  sort.addEventListener('change', () => {
    const v = sort.value;
    const base = getSaleProducts();
    if (v==='discount') items = base.sort((a,b)=>b.discount-a.discount);
    else if (v==='price-asc') items = base.sort((a,b)=>a.price-b.price);
    else if (v==='price-desc') items = base.sort((a,b)=>b.price-a.price);
    else if (v==='rating') items = base.sort((a,b)=>b.rating-a.rating);
    else items = base;
    render(items);
  });
  render(items);
});
</script>

<!-- Template Switcher -->
<style>
  .tmpl-switcher{position:fixed;bottom:24px;right:20px;z-index:9999;font-family:'Inter',sans-serif}
  .tmpl-btn{background:#8b1e3f;color:#fff;padding:9px 16px;border-radius:50px;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(139,30,63,.4);cursor:pointer;border:none;font-family:inherit}
  .tmpl-menu{position:absolute;bottom:calc(100% + 10px);right:0;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);overflow:hidden;min-width:210px;display:none}
  .tmpl-menu.open{display:block}
  .tmpl-menu-head{padding:12px 16px 8px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#666}
  .tmpl-option{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:.82rem;font-weight:500;border-top:1px solid #f5f5f5;text-decoration:none;color:#1a1a1a;transition:background .1s}
  .tmpl-option:hover{background:#fef0f3}
  .tmpl-option.active{font-weight:700;color:#8b1e3f}
  .tmpl-option.active::after{content:'\2713';margin-left:auto;color:#8b1e3f}
  .tmpl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  @media(max-width:480px){.tmpl-switcher{right:14px}.tmpl-btn{font-size:.68rem;padding:7px 12px}}
  @media(max-width:375px){.tmpl-switcher{right:12px}.tmpl-btn{font-size:.61rem;padding:6px 10px}}
  @media(max-width:320px){.tmpl-btn{font-size:.56rem;padding:5px 8px;gap:4px}}
</style>
<div class="tmpl-switcher">
  <div class="tmpl-menu" id="tmpl-menu">
    <div class="tmpl-menu-head">Choose Template</div>
    <a href="index.html" class="tmpl-option active">
      <span class="tmpl-dot" style="background:#8b1e3f"></span>
      Classic Boutique
    </a>
    <a href="index-urban.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#080808;border:1px solid #e63946"></span>
      Urban Dark
    </a>
    <a href="index-v3.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#8b1e3f;border:2px solid #fff;outline:2px solid #8b1e3f"></span>
      Fashion Hub
    </a>
    <a href="index-v4.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#c9a84c"></span>
      Luxe Gold
    </a>
    <a href="index-v5.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#e63c26"></span>
      Fresh Minimal
    </a>
    <a href="index-v6.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#c4a882"></span>
      Natural Linen
    </a>
    <a href="index-v7.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#2e6fad"></span>
      Denim &amp; Co.
    </a>
    <a href="index-v8.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#E8002D"></span>
      Street Raw
    </a>
    <a href="index-v9.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#111111;border:1px solid #555"></span>
      The Edit
    </a>
  </div>
  <button class="tmpl-btn" id="tmpl-toggle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    Templates
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="tmpl-arrow"><path d="m18 15-6-6-6 6"/></svg>
  </button>
</div>
<script>
  /* Highlight last-visited template */
  (function(){
    var t=localStorage.getItem('tuasl_tmpl')||'classic';
    var opts=document.querySelectorAll('.tmpl-option');
    opts.forEach(function(o){o.classList.remove('active');});
    var idx={classic:0,urban:1,nolimit:2,luxe:3,minimal:4,linen:5,denim:6,street:7,edit:8}[t]||0;
    if(opts[idx])opts[idx].classList.add('active');
  })();
  document.getElementById('tmpl-toggle').addEventListener('click',function(){
    var m=document.getElementById('tmpl-menu');
    var a=document.getElementById('tmpl-arrow');
    var o=m.classList.toggle('open');
    a.style.transform=o?'rotate(180deg)':'';
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.tmpl-switcher')){
      document.getElementById('tmpl-menu').classList.remove('open');
      document.getElementById('tmpl-arrow').style.transform='';
    }
  });
</script>
</body></html>
