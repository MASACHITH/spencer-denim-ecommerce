<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search TU@SL Fashion products.">
  <title>Search — TU@SL Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div id="header-placeholder"></div>
<main id="main-content">
  <div class="search-page-hero">
    <div class="container">
      <div class="search-page-input-wrap">
        <input type="search" class="search-page-input" id="search-input" placeholder="Search for products, styles, categories…" aria-label="Search" autocomplete="off">
        <button style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);color:var(--primary)" aria-label="Search" onclick="doSearch()">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </div>
      <div id="search-meta" style="margin-top:1rem;font-size:0.875rem;color:var(--muted)"></div>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div id="search-empty" class="search-empty" style="display:none">
        <svg width="80" height="80" fill="none" stroke="var(--border)" stroke-width="1" viewBox="0 0 24 24" style="margin:0 auto 1rem"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <h2>No results found</h2>
        <p id="search-empty-msg">Try different keywords or browse our categories.</p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem">
          <a href="women.html" class="btn btn-outline-dark">Women</a>
          <a href="men.html" class="btn btn-outline-dark">Men</a>
          <a href="kids.html" class="btn btn-outline-dark">Kids</a>
          <a href="new-arrivals.html" class="btn btn-primary">New Arrivals</a>
        </div>
      </div>

      <div id="search-popular" style="display:none">
        <h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem">Popular Searches</h3>
        <div id="popular-tags" style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:2rem"></div>
        <script>
          (function(){
            var terms=['Dresses','Polo Shirts','Activewear','Jeans','Baby Essentials','Sale','School Uniform','Linen'];
            document.getElementById('popular-tags').innerHTML=terms.map(function(s){
              return '<button class="tag" style="cursor:pointer" onclick="setSearch(\''+s+'\')">'+s+'</button>';
            }).join('');
          })();
        </script>
        <h3 style="font-size:1rem;font-weight:700;margin-bottom:1.25rem">Shop By Department</h3>
        <div class="dept-grid" style="grid-template-columns:repeat(4,1fr)">
          <a href="women.html" class="dept-card" style="aspect-ratio:1">
            <img src="https://images.pexels.com/photos/2220316/pexels-photo-2220316.jpeg?auto=compress&cs=tinysrgb&w=300&h=300&fit=crop" alt="Women" width="300" height="300" loading="lazy" onerror="this.src='assets/images/placeholders/product-placeholder.svg'">
            <div class="dept-card-overlay"><p class="dept-card-label" style="font-size:1rem">Women</p></div>
          </a>
          <a href="men.html" class="dept-card" style="aspect-ratio:1">
            <img src="https://images.pexels.com/photos/1043474/pexels-photo-1043474.jpeg?auto=compress&cs=tinysrgb&w=300&h=300&fit=crop" alt="Men" width="300" height="300" loading="lazy" onerror="this.src='assets/images/placeholders/product-placeholder.svg'">
            <div class="dept-card-overlay"><p class="dept-card-label" style="font-size:1rem">Men</p></div>
          </a>
          <a href="kids.html" class="dept-card" style="aspect-ratio:1">
            <img src="https://images.pexels.com/photos/35537/child-children-girl-happy.jpg?auto=compress&cs=tinysrgb&w=300&h=300&fit=crop" alt="Kids" width="300" height="300" loading="lazy" onerror="this.src='assets/images/placeholders/product-placeholder.svg'">
            <div class="dept-card-overlay"><p class="dept-card-label" style="font-size:1rem">Kids</p></div>
          </a>
          <a href="baby.html" class="dept-card" style="aspect-ratio:1">
            <img src="https://images.pexels.com/photos/1620760/pexels-photo-1620760.jpeg?auto=compress&cs=tinysrgb&w=300&h=300&fit=crop" alt="Baby" width="300" height="300" loading="lazy" onerror="this.src='assets/images/placeholders/product-placeholder.svg'">
            <div class="dept-card-overlay"><p class="dept-card-label" style="font-size:1rem">Baby</p></div>
          </a>
        </div>
      </div>

      <div class="products-grid" id="search-results"></div>
    </div>
  </section>
</main>
<div id="footer-placeholder"></div>
<script src="js/config.js"></script><script src="js/products.js"></script><script src="js/wishlist.js"></script><script src="js/cart.js"></script><script src="js/app.js"></script>
<script>
  let searchDebounce;
  function setSearch(q) {
    document.getElementById('search-input').value = q;
    doSearch();
  }
  function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    const resultsEl = document.getElementById('search-results');
    const emptyEl = document.getElementById('search-empty');
    const popularEl = document.getElementById('search-popular');
    const metaEl = document.getElementById('search-meta');
    if (!q) {
      resultsEl.innerHTML = '';
      emptyEl.style.display = 'none';
      popularEl.style.display = 'block';
      metaEl.textContent = '';
      // Update URL
      history.replaceState({}, '', 'search.html');
      return;
    }
    popularEl.style.display = 'none';
    const results = searchProducts(q);
    metaEl.textContent = results.length ? `${results.length} result${results.length!==1?'s':''} for "${q}"` : '';
    if (results.length === 0) {
      resultsEl.innerHTML = '';
      emptyEl.style.display = 'block';
      document.getElementById('search-empty-msg').textContent = `No results for "${q}". Try different keywords.`;
    } else {
      emptyEl.style.display = 'none';
      resultsEl.innerHTML = results.map(renderProductCard).join('');
      initScrollReveal();
    }
    history.replaceState({}, '', `search.html?q=${encodeURIComponent(q)}`);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q') || '';
    const input = document.getElementById('search-input');
    if (q) { input.value = q; doSearch(); }
    else {
      document.getElementById('search-popular').style.display = 'block';
    }
    input.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(doSearch, 350);
    });
    input.addEventListener('keydown', e => { if (e.key==='Enter') { clearTimeout(searchDebounce); doSearch(); } });
  });
</script>

<!-- Template Switcher -->
<style>
  .tmpl-switcher{position:fixed;bottom:24px;right:20px;z-index:9999;font-family:'Inter',sans-serif}
  .tmpl-btn{background:#8b1e3f;color:#fff;padding:9px 16px;border-radius:50px;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(139,30,63,.4);cursor:pointer;border:none;font-family:inherit}
  .tmpl-menu{position:absolute;bottom:calc(100% + 10px);right:0;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);overflow:hidden;min-width:210px;display:none}
  .tmpl-menu.open{display:block}
  .tmpl-menu-head{padding:12px 16px 8px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#666}
  .tmpl-option{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:.82rem;font-weight:500;border-top:1px solid #f5f5f5;text-decoration:none;color:#1a1a1a;transition:background .1s}
  .tmpl-option:hover{background:#fef0f3}
  .tmpl-option.active{font-weight:700;color:#8b1e3f}
  .tmpl-option.active::after{content:'\2713';margin-left:auto;color:#8b1e3f}
  .tmpl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  @media(max-width:480px){.tmpl-switcher{right:14px}.tmpl-btn{font-size:.68rem;padding:7px 12px}}
  @media(max-width:375px){.tmpl-switcher{right:12px}.tmpl-btn{font-size:.61rem;padding:6px 10px}}
  @media(max-width:320px){.tmpl-btn{font-size:.56rem;padding:5px 8px;gap:4px}}
</style>
<div class="tmpl-switcher">
  <div class="tmpl-menu" id="tmpl-menu">
    <div class="tmpl-menu-head">Choose Template</div>
    <a href="index.html" class="tmpl-option active">
      <span class="tmpl-dot" style="background:#8b1e3f"></span>
      Classic Boutique
    </a>
    <a href="index-urban.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#080808;border:1px solid #e63946"></span>
      Urban Dark
    </a>
    <a href="index-v3.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#8b1e3f;border:2px solid #fff;outline:2px solid #8b1e3f"></span>
      Fashion Hub
    </a>
    <a href="index-v4.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#c9a84c"></span>
      Luxe Gold
    </a>
    <a href="index-v5.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#e63c26"></span>
      Fresh Minimal
    </a>
    <a href="index-v6.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#c4a882"></span>
      Natural Linen
    </a>
    <a href="index-v7.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#2e6fad"></span>
      Denim &amp; Co.
    </a>
    <a href="index-v8.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#E8002D"></span>
      Street Raw
    </a>
    <a href="index-v9.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#111111;border:1px solid #555"></span>
      The Edit
    </a>
  </div>
  <button class="tmpl-btn" id="tmpl-toggle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    Templates
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="tmpl-arrow"><path d="m18 15-6-6-6 6"/></svg>
  </button>
</div>
<script>
  /* Highlight last-visited template */
  (function(){
    var t=localStorage.getItem('tuasl_tmpl')||'classic';
    var opts=document.querySelectorAll('.tmpl-option');
    opts.forEach(function(o){o.classList.remove('active');});
    var idx={classic:0,urban:1,nolimit:2,luxe:3,minimal:4,linen:5,denim:6,street:7,edit:8}[t]||0;
    if(opts[idx])opts[idx].classList.add('active');
  })();
  document.getElementById('tmpl-toggle').addEventListener('click',function(){
    var m=document.getElementById('tmpl-menu');
    var a=document.getElementById('tmpl-arrow');
    var o=m.classList.toggle('open');
    a.style.transform=o?'rotate(180deg)':'';
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.tmpl-switcher')){
      document.getElementById('tmpl-menu').classList.remove('open');
      document.getElementById('tmpl-arrow').style.transform='';
    }
  });
</script>
</body></html>
