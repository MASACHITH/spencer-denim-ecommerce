<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse TU@SL Fashion products — Women, Men, Kids and Baby clothing, footwear and accessories.">
  <title>Shop — TU@SL Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <div class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span>›</span>
          <span id="breadcrumb-current">Shop</span>
        </nav>
        <h1 id="page-heading">All Products</h1>
        <p id="page-desc">Discover quality fashion for every member of the family.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <!-- Mobile Filter Button -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
          <button class="mobile-filter-btn" onclick="openFilterDrawer()" aria-label="Open filters">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/></svg>
            Filters
          </button>
          <div id="active-filters" class="active-filters"></div>
        </div>

        <div class="category-layout">
          <!-- Sidebar -->
          <aside aria-label="Product filters">
            <div class="filter-sidebar" id="filter-sidebar"></div>
          </aside>

          <!-- Products -->
          <div class="category-main">
            <div class="category-toolbar">
              <p class="category-count" id="product-count"></p>
              <select class="sort-select" id="sort-select" aria-label="Sort products">
                <option value="recommended">Recommended</option>
                <option value="newest">Newest</option>
                <option value="bestselling">Best Selling</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
                <option value="discount">Biggest Discount</option>
              </select>
            </div>

            <div class="products-grid" id="products-grid"></div>

            <div id="no-products" style="display:none" class="wishlist-empty">
              <h2>No products found</h2>
              <p>Try adjusting your filters or <button class="btn btn-primary btn-sm" onclick="clearAllFilters()" style="display:inline-flex;margin-top:0.5rem">Clear Filters</button></p>
            </div>

            <div class="load-more-wrap">
              <button id="load-more-btn" class="btn btn-outline-dark" onclick="loadMore()" style="display:none">Load More Products</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Mobile Filter Drawer -->
  <div class="filter-overlay" id="filter-overlay">
    <div class="filter-drawer">
      <div class="filter-drawer-header">
        <h3>Filters</h3>
        <button onclick="closeFilterDrawer()" aria-label="Close filters">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="filter-drawer-body"></div>
      <div class="filter-drawer-footer">
        <button class="btn btn-outline-dark btn-full" onclick="clearAllFilters(); closeFilterDrawer()">Clear All</button>
        <button class="btn btn-primary btn-full" onclick="closeFilterDrawer()">View Results</button>
      </div>
    </div>
  </div>
  <div onclick="if(event.target===this)closeFilterDrawer()" id="filter-bg"></div>

  <div id="footer-placeholder"></div>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/filters.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCategoryPage();
      // Update breadcrumb
      const params = new URLSearchParams(window.location.search);
      const bc = document.getElementById('breadcrumb-current');
      const ph = document.getElementById('page-heading');
      if (bc) {
        if (params.get('department')) bc.textContent = params.get('department');
        else if (params.get('sale')) bc.textContent = 'Sale';
        else if (params.get('new')) bc.textContent = 'New Arrivals';
        else if (params.get('category')) bc.textContent = params.get('category');
      }
    });
  </script>

<!-- Template Switcher -->
<style>
  .tmpl-switcher{position:fixed;bottom:24px;right:20px;z-index:9999;font-family:'Inter',sans-serif}
  .tmpl-btn{background:#8b1e3f;color:#fff;padding:9px 16px;border-radius:50px;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(139,30,63,.4);cursor:pointer;border:none;font-family:inherit}
  .tmpl-menu{position:absolute;bottom:calc(100% + 10px);right:0;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);overflow:hidden;min-width:210px;display:none}
  .tmpl-menu.open{display:block}
  .tmpl-menu-head{padding:12px 16px 8px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#666}
  .tmpl-option{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:.82rem;font-weight:500;border-top:1px solid #f5f5f5;text-decoration:none;color:#1a1a1a;transition:background .1s}
  .tmpl-option:hover{background:#fef0f3}
  .tmpl-option.active{font-weight:700;color:#8b1e3f}
  .tmpl-option.active::after{content:'✓';margin-left:auto;color:#8b1e3f}
  .tmpl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  @media(max-width:480px){.tmpl-switcher{right:14px}.tmpl-btn{font-size:.68rem;padding:7px 12px}}
  @media(max-width:375px){.tmpl-switcher{right:12px}.tmpl-btn{font-size:.61rem;padding:6px 10px}}
  @media(max-width:320px){.tmpl-btn{font-size:.56rem;padding:5px 8px;gap:4px}}
</style>
<div class="tmpl-switcher">
  <div class="tmpl-menu" id="tmpl-menu">
    <div class="tmpl-menu-head">Choose Template</div>
    <a href="index.html" class="tmpl-option active">
      <span class="tmpl-dot" style="background:#8b1e3f"></span>
      Classic Boutique
    </a>
    <a href="index-urban.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#080808;border:1px solid #e63946"></span>
      Urban Dark
    </a>
    <a href="index-v3.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#8b1e3f;border:2px solid #fff;outline:2px solid #8b1e3f"></span>
      Fashion Hub
    </a>
    <a href="index-v4.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#c9a84c"></span>
      Luxe Gold
    </a>
    <a href="index-v5.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#e63c26"></span>
      Fresh Minimal
    </a>
    <a href="index-v6.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#c4a882"></span>
      Natural Linen
    </a>
    <a href="index-v7.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#2e6fad"></span>
      Denim &amp; Co.
    </a>
    <a href="index-v8.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#E8002D"></span>
      Street Raw
    </a>
    <a href="index-v9.html" class="tmpl-option">
      <span class="tmpl-dot" style="background:#111111;border:1px solid #555"></span>
      The Edit
    </a>
  </div>
  <button class="tmpl-btn" id="tmpl-toggle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    Templates
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="tmpl-arrow"><path d="m18 15-6-6-6 6"/></svg>
  </button>
</div>
<script>
  /* Highlight last-visited template */
  (function(){
    var t=localStorage.getItem('tuasl_tmpl')||'classic';
    var opts=document.querySelectorAll('.tmpl-option');
    opts.forEach(function(o){o.classList.remove('active');});
    var idx={classic:0,urban:1,nolimit:2,luxe:3,minimal:4,linen:5,denim:6,street:7,edit:8}[t]||0;
    if(opts[idx])opts[idx].classList.add('active');
  })();
  document.getElementById('tmpl-toggle').addEventListener('click',function(){
    var m=document.getElementById('tmpl-menu');
    var a=document.getElementById('tmpl-arrow');
    var o=m.classList.toggle('open');
    a.style.transform=o?'rotate(180deg)':'';
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.tmpl-switcher')){
      document.getElementById('tmpl-menu').classList.remove('open');
      document.getElementById('tmpl-arrow').style.transform='';
    }
  });
</script>
</body>
</html>
